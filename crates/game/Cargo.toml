[package]
name = "game"
description = "Eonmark: the Bevy presentation layer and the `eonmark` binary (the only engine-dependent crate)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "eonmark"
path = "src/main.rs"

[features]
default = []
# Fast iteration + inspector panels. Never ship a build with this feature.
dev = [
  "bevy/dynamic_linking",
  "bevy/bevy_dev_tools",
  "dep:bevy_egui",
  "dep:bevy-inspector-egui",
]
# Owner-side screenshot capture via Bevy's CI testing plugin; not used in CI.
ci_testing = ["bevy/bevy_ci_testing"]

[dependencies]
sim.workspace = true
rules.workspace = true
ai.workspace = true
bevy = { workspace = true, features = ["gestures"] }
bevy_egui = { workspace = true, optional = true }
bevy-inspector-egui = { workspace = true, optional = true }
# Replay directory (`ProjectDirs::from("com", "tonianev", "Eonmark").data_dir()/replays`).
directories.workspace = true

# Native macOS menu with the custom Cmd-Q item (`macos_menu.rs`). Mac only, so the
# Linux clippy job never compiles it; `default-features = false` drops muda's
# `gtk3` default so gtk never enters Cargo.lock (see deny.toml).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { workspace = true, default-features = false }
# Background mode (`background.rs`): Accessory activation policy and handing
# focus back to the previously frontmost app. The versions muda already pulls
# in (objc2 0.6.5, objc2-app-kit 0.3.2), so no new crate enters Cargo.lock.
objc2 = { workspace = true }
objc2-app-kit = { workspace = true, features = [
  "std",
  "NSApplication",
  "NSResponder",
  "NSRunningApplication",
  "NSWorkspace",
] }

[dev-dependencies]
# HUD fit tests: Inter's advance widths (`fonts::measure`), the skrifa that
# parley already locks.
skrifa.workspace = true

[lints]
workspace = true
