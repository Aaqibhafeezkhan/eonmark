[package]
name = "sim"
description = "Eonmark deterministic fixed-point simulation (engine-free)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rules.workspace = true
fixed.workspace = true
serde.workspace = true
postcard.workspace = true
xxhash-rust.workspace = true
rand_pcg.workspace = true
rand_core.workspace = true
ron.workspace = true

[dev-dependencies]
pathfinding.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "step_500_units"
harness = false

[[bench]]
name = "astar_budget"
harness = false

[[bench]]
name = "territory_recompute"
harness = false

[[bench]]
name = "combat_step"
harness = false

[lints]
workspace = true

# `ron` (map tables) is listed by the design and not yet used directly in sim
# (maps arrive parsed through `rules`). Ignored by cargo-machete until then.
[package.metadata.cargo-machete]
ignored = ["ron"]
