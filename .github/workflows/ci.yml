# Per-PR and main-branch CI. `just ci` runs the same steps locally.
# Every Bevy compile in the `check` job uses the single `ci` Cargo profile so one
# target directory is cached. The release profile is built only in
# release-check.yml and release.yml.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTDOCFLAGS: -D warnings
  RUST_BACKTRACE: "1"

defaults:
  run:
    # Explicit bash gives `set -eo pipefail`, so `cmd | tee` fails when cmd fails.
    shell: bash

jobs:
  check:
    name: check (macos-26)
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: check
          cache-on-failure: true
          # Keep RUSTFLAGS empty so cache keys match local builds; -D warnings is
          # passed to clippy explicitly below and to rustdoc via RUSTDOCFLAGS.
          rustflags: ""
          build-warnings: warn

      - name: Install cargo tools
        uses: taiki-e/install-action@v2
        with:
          # Pinned to the versions of the M0 local pass (docs/DEPENDENCIES.md);
          # bump here and there together.
          tool: cargo-nextest@0.9.146,cargo-machete@0.9.2,typos-cli@1.50.3,just@1.58.0

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy (workspace, all targets)
        run: cargo clippy --workspace --all-targets --locked --profile ci -- -D warnings

      - name: clippy (game, dev feature)
        run: cargo clippy -p game --features dev --locked --profile ci -- -D warnings

      - name: nextest
        run: cargo nextest run --workspace --locked --cargo-profile ci --profile ci

      - name: doctests
        run: cargo test --doc --workspace --locked --profile ci

      - name: rustdoc
        run: cargo doc --workspace --no-deps --locked --profile ci

      - name: unused dependencies
        run: cargo machete

      - name: spelling
        run: typos

      - name: asset policy
        run: scripts/check_assets.sh

      - name: asset policy self-test (an unattributed file fails with its path)
        run: scripts/check_assets.sh --self-test

      - name: model check (inspect_gltf over data/visuals.ron and assets/)
        # Budgets, import rules, team swatches and silhouettes of every Scene
        # (docs/ART_STYLE.md); no engine crate, so the release build is small.
        run: cargo run -p inspect_gltf --locked --release -- check data assets

      - name: naming policy
        run: scripts/check_trademark.sh

      - name: exactly one Bevy in the graph
        run: test "$(cargo tree -i bevy_ecs --depth 0 | wc -l | tr -d ' ')" -eq 1

      - name: headless replay (move_500 fixture)
        # The game re-simulates the 1200-tick golden through its own driver
        # (`sim_driver::ReplayInput`) and exits 0 only if the recorded final
        # hash matches; the last stdout line is `tick=1200 hash=0x...`, kept
        # alone so hash-parity diffs cleanly. Reuses the ci-profile artifacts
        # from clippy/nextest above.
        run: |
          cargo run -p game --locked --profile ci -- --headless-run crates/sim/tests/fixtures/move_500.eonreplay | tail -n 1 | tee hash-macos.txt
          grep -q '^tick=1200 hash=0x[0-9a-f]\{16\}$' hash-macos.txt

      - name: verify golden fixtures move_500, combat_skirmish, enemy_outpost_walkthrough, capture_seat, stalemate_45min and m5_first_match (release)
        # The same commands run in the headless job on Linux; hash-parity
        # diffs each pair of `OK final_hash=...` lines (combat_skirmish puts
        # acquisition, shooters, hits and destruction under the parity
        # check; capture_seat (M5a) attrition, annexation and the outcome;
        # stalemate_45min (M5a) 54000 ticks of income and the territory
        # cap; m5_first_match (M5b) the Standard bot in both seats, rebuilt
        # from the header, to its Seat capture). enemy_outpost_walkthrough
        # (M4b: a 200 vs 200 prologue, then the line-1 build-up and siege)
        # is verified on both OSes against the hashes recorded in it.
        # `verify` exits 1 on any other outcome and pipefail propagates it
        # through grep and tee.
        run: |
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/move_500.eonreplay | grep '^OK' | tee hash-macos-fixture.txt
          test -s hash-macos-fixture.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/combat_skirmish.eonreplay | grep '^OK' | tee hash-macos-combat.txt
          test -s hash-macos-combat.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/enemy_outpost_walkthrough.eonreplay
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/capture_seat.eonreplay | grep '^OK' | tee hash-macos-capture-seat.txt
          test -s hash-macos-capture-seat.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/stalemate_45min.eonreplay | grep '^OK' | tee hash-macos-stalemate.txt
          test -s hash-macos-stalemate.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/m5_first_match.eonreplay | grep '^OK' | tee hash-macos-m5.txt
          test -s hash-macos-m5.txt

      - name: M6 acceptance 3 (two play-bots --seeds 7..7 runs print identical final hashes)
        # ROADMAP M6 line 3, the literal command twice on macOS (the headless
        # job runs the same on Linux): the CSVs hold no wall time, so they
        # must be byte-identical; the final hash goes to hash-macos-seed7.txt
        # and hash-parity diffs it against Linux's. A second pair, Hard
        # against Easy with the rush and tower personalities, puts the
        # difficulty paths (the disclosed bonus of step 6d', the resolved
        # knobs) and slice 2's behaviours (raids, the deadline raid, the
        # Wain rule, reactive towers) under the same checks; it is not part
        # of the literal line, so --allow-undecided keeps a draw from
        # failing it.
        run: |
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 > s7a.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 > s7b.csv
          diff s7a.csv s7b.csv
          awk -F, 'NR==2{print "seed=7 standard/standard final_hash=" $5}' s7a.csv | tee hash-macos-seed7.txt
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 --a hard --b easy --personality-a rush --personality-b tower --allow-undecided > s7c.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 --a hard --b easy --personality-a rush --personality-b tower --allow-undecided > s7d.csv
          diff s7c.csv s7d.csv
          awk -F, 'NR==2{print "seed=7 hard-rush/easy-tower final_hash=" $5}' s7c.csv | tee -a hash-macos-seed7.txt
          test "$(grep -c 'final_hash=0x[0-9a-f]\{16\}$' hash-macos-seed7.txt)" = 2

      - uses: actions/upload-artifact@v7
        with:
          name: hash-macos
          path: |
            hash-macos.txt
            hash-macos-fixture.txt
            hash-macos-combat.txt
            hash-macos-capture-seat.txt
            hash-macos-stalemate.txt
            hash-macos-m5.txt
            hash-macos-seed7.txt
          if-no-files-found: error

  headless:
    name: headless (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # 30 minutes once the cache is warm; the first cold Bevy build for the
    # Linux hash needs more.
    timeout-minutes: 45
    env:
      PROPTEST_CASES: "256"
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries for the game crate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: headless
          cache-on-failure: true
          rustflags: ""
          build-warnings: warn

      - name: engine-free crate tests
        run: cargo test -p sim -p rules -p ai -p sim-cli --locked

      - name: ignored enemy_outpost tests (M4b prologue, beats and golden)
        # The 400-unit prologue keeps these out of the local `cargo test -p
        # sim` budget; the sim crate is opt-level 3 in dev, so no --release.
        run: cargo test -p sim --locked -- --ignored enemy_outpost

      - name: data-check
        run: cargo run -p sim-cli --locked -- data-check data

      - name: selftest
        run: cargo run -p sim-cli --locked -- selftest

      - name: verify golden fixtures (release)
        # Long goldens are verified here in release rather than by
        # `cargo test -- --ignored` (move_500, enemy_outpost_walkthrough and
        # M5a's 54000-tick stalemate_45min). move_500, combat_skirmish,
        # capture_seat and stalemate_45min are the hash-parity fixtures:
        # only their `OK final_hash=...` lines are kept so the diffs are
        # clean; `verify` exits 1 on any other outcome and pipefail
        # propagates it.
        # m5_first_match (M5b) is the bot-match parity fixture.
        run: |
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/move_500.eonreplay | grep '^OK' | tee hash-linux-fixture.txt
          test -s hash-linux-fixture.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/group_spiral.eonreplay | tee verify-group-spiral.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/snapshot_restore.eonreplay | tee verify-snapshot-restore.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/economy_second_town.eonreplay | tee verify-economy-second-town.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/economy_walkthrough.eonreplay | tee verify-economy-walkthrough.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/combat_skirmish.eonreplay | grep '^OK' | tee hash-linux-combat.txt
          test -s hash-linux-combat.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/enemy_outpost_walkthrough.eonreplay | tee verify-enemy-outpost-walkthrough.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/capture_seat.eonreplay | grep '^OK' | tee hash-linux-capture-seat.txt
          test -s hash-linux-capture-seat.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/stalemate_45min.eonreplay | grep '^OK' | tee hash-linux-stalemate.txt
          test -s hash-linux-stalemate.txt
          cargo run -p sim-cli --locked --release -- verify crates/sim/tests/fixtures/m5_first_match.eonreplay | grep '^OK' | tee hash-linux-m5.txt
          test -s hash-linux-m5.txt

      - name: M5b acceptance 1 (Standard vs Standard, five seeds, twice)
        # ROADMAP M5b line 1: the literal play-bots command twice. Exit 0
        # already means a declared winner in every game (no draw, no
        # undecided game, no panic); the two CSVs (which hold no wall time)
        # must be identical, every winner must be a or b, and seed 1's final
        # hash must be the m5_first_match golden's. The stderr summary
        # (wall_s, decisive and tiebreak counts) is in the log.
        run: |
          cargo run -p sim-cli --locked --release -- play-bots --seeds 1..5 --a standard --b standard --max-ticks 54000 --jobs 5 | tee m5b-run1.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 1..5 --a standard --b standard --max-ticks 54000 --jobs 5 > m5b-run2.csv
          diff m5b-run1.csv m5b-run2.csv
          if awk -F, 'NR>1 && $2!="a" && $2!="b"' m5b-run1.csv | grep -q .; then
            echo "::error::a Standard-vs-Standard game has no declared winner"; exit 1
          fi
          test "$(awk -F, '$1==1{print $5}' m5b-run1.csv)" = "$(cat crates/sim/tests/fixtures/m5_first_match.hash)"

      - name: M5b acceptance 2 (the first wave against Passive, from either side)
        # ROADMAP M5b line 2 through scripts/check_first_wave.sh with
        # --decisive: owner decision 4's Seat capture from either side, plus
        # the plan's extra gates from the ROADMAP M5b Goal (the second Town
        # and the Watchtower before tick 18000), for the Standard bot as
        # player a and, swapped, as player b (the New Game seat).
        run: |
          cargo run -p sim-cli --locked --release -- play-bots --seeds 1..5 --a standard --b passive --max-ticks 36000 | tee m5b-wave-a.csv
          scripts/check_first_wave.sh --decisive m5b-wave-a.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 1..5 --a passive --b standard --max-ticks 36000 | tee m5b-wave-b.csv
          scripts/check_first_wave.sh --side b --decisive m5b-wave-b.csv

      - name: M6 acceptance 3 (two play-bots --seeds 7..7 runs print identical final hashes)
        # ROADMAP M6 line 3 on Linux, the same commands as the macOS check
        # job; hash-parity diffs the two hash-<os>-seed7.txt files.
        run: |
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 > s7a.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 > s7b.csv
          diff s7a.csv s7b.csv
          awk -F, 'NR==2{print "seed=7 standard/standard final_hash=" $5}' s7a.csv | tee hash-linux-seed7.txt
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 --a hard --b easy --personality-a rush --personality-b tower --allow-undecided > s7c.csv
          cargo run -p sim-cli --locked --release -- play-bots --seeds 7..7 --a hard --b easy --personality-a rush --personality-b tower --allow-undecided > s7d.csv
          diff s7c.csv s7d.csv
          awk -F, 'NR==2{print "seed=7 hard-rush/easy-tower final_hash=" $5}' s7c.csv | tee -a hash-linux-seed7.txt
          test "$(grep -c 'final_hash=0x[0-9a-f]\{16\}$' hash-linux-seed7.txt)" = 2

      - name: ignored M5b bot tests (long games)
        # The m5b_ filter leaves out golden_m5_first_match, which the
        # release verify above covers. `ai` is opt-level 3 in dev.
        run: cargo test -p ai --locked -- --ignored m5b_

      - name: engine boundary (no bevy/glam/wgpu/winit in engine-free crates and tools)
        run: |
          for crate in sim rules ai sim-cli inspect_gltf; do
            if cargo tree -p "$crate" -e normal --locked | grep -E 'bevy|glam|wgpu|winit'; then
              echo "::error::crate $crate depends on an engine crate"
              exit 1
            fi
          done

      - name: pathfinding is a dev-dependency only
        # The oracle crate must never reach the normal dependency graph of sim.
        run: |
          if cargo tree -p sim -e normal --locked | grep -q pathfinding; then
            echo "::error::pathfinding is a normal dependency of sim; it may only be a dev-dependency oracle"
            exit 1
          fi

      - name: fixture policy (goldens change only with a rules_version bump)
        # docs/DETERMINISM.md, "Golden fixtures". The checkout is shallow, so
        # fetch the PR base commit before diffing against it.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          scripts/check_fixture_policy.sh "${{ github.event.pull_request.base.sha }}"

      - name: headless replay (move_500 fixture)
        # Same command as the macOS job; the two `tick=1200 hash=0x...` lines
        # must be byte-identical (hash-parity job).
        run: |
          cargo run -p game --locked --profile ci -- --headless-run crates/sim/tests/fixtures/move_500.eonreplay | tail -n 1 | tee hash-linux.txt
          grep -q '^tick=1200 hash=0x[0-9a-f]\{16\}$' hash-linux.txt

      - name: headless replay (enemy_outpost_walkthrough fixture)
        # M4b: the game's own driver re-simulates the scripted owner proxy
        # (400 units fighting, then the build-up and siege) and exits 0 only
        # if its final hash matches the recorded one.
        run: cargo run -p game --locked --profile ci -- --headless-run crates/sim/tests/fixtures/enemy_outpost_walkthrough.eonreplay | tail -n 1

      - name: headless replay (m5_first_match fixture)
        # M5b: the game builds the two Standard bots from the header and
        # re-simulates the first match to its Seat capture; it exits 0 only
        # if its final hash matches the recorded one.
        run: cargo run -p game --locked --profile ci -- --headless-run crates/sim/tests/fixtures/m5_first_match.eonreplay | tail -n 1

      - uses: actions/upload-artifact@v7
        with:
          name: hash-linux
          path: |
            hash-linux.txt
            hash-linux-fixture.txt
            hash-linux-combat.txt
            hash-linux-capture-seat.txt
            hash-linux-stalemate.txt
            hash-linux-m5.txt
            hash-linux-seed7.txt
          if-no-files-found: error

  fun-gate:
    name: fun-gate (ubuntu-24.04)
    runs-on: ubuntu-24.04
    # ROADMAP M6 acceptance 1, 2 and 4 with the literal commands (the M6
    # plan's "fun-gate" job, docs/design/ai.md "The fun gate in CI"), in
    # parallel with headless so that job keeps its time. Measured on the
    # 4-vCPU VM: about 8-19 minutes once sim-cli is cached; if the job
    # passes 25 minutes, the flip moves to release-check.yml. Every check
    # step runs even when an earlier one failed (`!cancelled()`), and
    # inside a step every command runs too (`|| rc=1`, then `exit "$rc"`:
    # the default shell is `bash -eo pipefail`, which would otherwise stop
    # at the first failing command and hide the rest), so one run reports
    # every line; the job still fails if any step does.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          cache-shared-key: fun-gate
          cache-on-failure: true
          rustflags: ""
          build-warnings: warn

      - name: build sim-cli (release)
        run: cargo build -p sim-cli --locked --release

      - name: M6 acceptance 1 (20 personality games, a winner in all)
        if: ${{ !cancelled() }}
        # The literal command; scripts/fun_gate.sh checks every clause by
        # the M6 owner decision 1 readings (a winner is a or b; decisive is
        # seat_captured before tick 48000; past 24000 is tick > 24000).
        # The line requires exit 0, so play-bots' exit fails the step, but
        # only after the summary and fun_gate.sh's clauses are printed.
        run: |
          start=$(date +%s)
          rc=0
          target/release/sim-cli play-bots --seeds 1..20 --a standard --b standard --personality-a rush,boom,tower --personality-b rush,boom,tower --max-ticks 72000 --jobs 5 > l1.csv 2> l1.err || { echo "play-bots exit=$?"; rc=1; }
          tail -n 1 l1.err
          scripts/fun_gate.sh l1.csv l1.err || rc=1
          echo "elapsed_s=$(( $(date +%s) - start ))"
          exit "$rc"

      - name: M6 acceptance 2 (Standard beats Easy, Hard beats Standard)
        if: ${{ !cancelled() }}
        # The literal commands at --jobs 4 and with --allow-undecided: the
        # CSV is the same at any --jobs and with or without the flag, which
        # only stops a draw from making play-bots exit 1 (the line counts
        # wins, not draws; a panic or a usage error still exits non-zero
        # and fails the step). Only `winner == b` counts; check_ordering.sh
        # also prints the cap games that ended untouched. Both pairings run
        # and report whatever the first one gave.
        run: |
          start=$(date +%s)
          rc=0
          target/release/sim-cli play-bots --a easy --b standard --seeds 1..20 --jobs 4 --allow-undecided > e_s.csv 2> e_s.err || { echo "play-bots exit=$?"; rc=1; }
          tail -n 1 e_s.err
          scripts/check_ordering.sh e_s.csv b 15 || rc=1
          target/release/sim-cli play-bots --a standard --b hard --seeds 1..20 --jobs 4 --allow-undecided > s_h.csv 2> s_h.err || { echo "play-bots exit=$?"; rc=1; }
          tail -n 1 s_h.err
          scripts/check_ordering.sh s_h.csv b 15 || rc=1
          echo "elapsed_s=$(( $(date +%s) - start ))"
          exit "$rc"

      - name: M6 acceptance 4, first clause (Hard attacks the borders before minute 12)
        if: ${{ !cancelled() }}
        # Hard against Passive in seeds 1..3, as the New Game seat (b), with
        # every Random style, and from seat a; check_attack_before.sh also
        # requires an armed unit on the enemy's land before tick 14400.
        run: |
          rc=0
          target/release/sim-cli play-bots --seeds 1..3 --a passive --b hard --max-ticks 14400 --allow-undecided > h.csv || rc=1
          scripts/check_attack_before.sh --side b --before 14400 h.csv || rc=1
          target/release/sim-cli play-bots --seeds 1..3 --a passive --b hard --personality-b rush,boom,tower --max-ticks 14400 --allow-undecided > hp.csv || rc=1
          scripts/check_attack_before.sh --side b --before 14400 hp.csv || rc=1
          target/release/sim-cli play-bots --seeds 1..3 --a hard --b passive --max-ticks 14400 --allow-undecided > ha.csv || rc=1
          scripts/check_attack_before.sh --side a --before 14400 ha.csv || rc=1
          exit "$rc"

      - name: M6 acceptance 4, second clause (hard.ron income_interval_ds 200 -> 300 flips Hard vs Easy)
        if: ${{ !cancelled() }}
        run: |
          start=$(date +%s)
          rc=0
          scripts/check_difficulty_flip.sh || rc=1
          echo "elapsed_s=$(( $(date +%s) - start ))"
          exit "$rc"

      - name: ignored M6 bot tests (long games)
        if: ${{ !cancelled() }}
        run: cargo test -p ai --locked -- --ignored m6_

  game-linux:
    name: game compiles on Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Install system libraries for the game crate
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev libwayland-dev libxkbcommon-dev

      - name: Install Rust toolchain (rust-toolchain.toml)
        uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          # Bumped when the job started building the binary (render smoke):
          # rust-cache saves only under a new key, so the old clippy-only
          # cache would leave every run building the game cold.
          cache-shared-key: game-linux-build
          cache-on-failure: true
          rustflags: ""
          build-warnings: warn

      - name: clippy (game, Linux)
        run: cargo clippy -p game --all-targets --locked --profile ci -- -D warnings

      # Bevy compiles WGSL only when it builds a pipeline, and a shader that
      # fails is logged while the game runs on and exits 0; this renders the
      # walkthrough on lavapipe and fails on any ERROR line (render_watchdog.rs
      # adds one for a pipeline that never becomes ready). Since M4b it also
      # renders `unit_looks`, one of every unit look per team at 40 m, and
      # `enemy_outpost` at tick 400 in its own framing: 400 units mid-fight
      # with health bars, so the unlit bar pipeline compiles. Since art
      # slice 4 its 400 units are KayKit character models (about 2.2 M
      # triangles in the main pass), which lavapipe draws at about 1.4 s a
      # frame, so tick 400 comes about 120 s in: it gets a 180 s deadline
      # (the sixth argument; docs/BUILD_TIMES.md). Since art slice 6 it
      # also renders `art_bench`, the art pass's stress scene (two full
      # Towns, 400 units fighting, all of P0's units selected at tick 40),
      # in its own 60 m framing: on lavapipe it draws about one frame a
      # second, so on the 4-vCPU VM tick 200 came 64 s in and the run's
      # 120 s reached tick 493, past the whole fight (ticks 47 to 388);
      # tick 300 came 78 to 87 s in, too close to 120 s for a runner of
      # unknown speed.
      # winit loads libxkbcommon-x11 and the X libraries at run time; the
      # runner image lacks the first. The screenshots are uploaded for
      # review.
      - name: Render smoke test (Xvfb, lavapipe)
        run: |
          sudo apt-get install -y --no-install-recommends xvfb mesa-vulkan-drivers libxkbcommon-x11-0 libx11-xcb1 libxcursor1 libxi6 libxrandr2
          cargo build -p game --locked --profile ci
          scripts/render_smoke.sh target/ci/eonmark "$RUNNER_TEMP/render-smoke"
          scripts/render_smoke.sh target/ci/eonmark "$RUNNER_TEMP/render-smoke/unit_looks" unit_looks 20,32,40 100
          scripts/render_smoke.sh target/ci/eonmark "$RUNNER_TEMP/render-smoke/enemy_outpost" enemy_outpost '' 400 180
          scripts/render_smoke.sh target/ci/eonmark "$RUNNER_TEMP/render-smoke/art_bench" art_bench '' 200 120

      # Art pass AP4: every render smoke runs with --draw-stats and prints
      # `frame_stats: draws ... max=<n> ...`; fail unless every run's maximum
      # is under 500 draw calls a frame (scripts/check_draws.sh; `mode=none`
      # fails, since the counter does not count it). For `art_bench` (and
      # `enemy_outpost`) --fight also requires that the fight was measured:
      # a non-zero `fight_max` and a `frame_stats: fight` line with fight
      # frames and ticks, so a run whose armies never fought fails.
      - name: Draw-call gate (under 500 a frame)
        run: |
          scripts/check_draws.sh "$RUNNER_TEMP/render-smoke/render_smoke.log"
          scripts/check_draws.sh "$RUNNER_TEMP/render-smoke/unit_looks/render_smoke.log"
          scripts/check_draws.sh --fight "$RUNNER_TEMP/render-smoke/enemy_outpost/render_smoke.log"
          scripts/check_draws.sh --fight "$RUNNER_TEMP/render-smoke/art_bench/render_smoke.log"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: render-smoke
          path: ${{ runner.temp }}/render-smoke/
          if-no-files-found: warn

  deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          arguments: --all-features

  hash-parity:
    name: hash parity (macOS vs Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [check, headless]
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: hash-macos
          path: hashes/macos
      - uses: actions/download-artifact@v8
        with:
          name: hash-linux
          path: hashes/linux
      - name: compare headless replay (move_500 fixture)
        # Both files hold exactly the `tick=1200 hash=0x...` line the game's
        # `--headless-run crates/sim/tests/fixtures/move_500.eonreplay`
        # printed last on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos.txt
          echo "Linux:"; cat hashes/linux/hash-linux.txt
          diff hashes/macos/hash-macos.txt hashes/linux/hash-linux.txt

      - name: compare golden fixture move_500
        # Both files hold exactly the `OK final_hash=0x... ticks=...` line
        # that `sim-cli verify --release` printed on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-fixture.txt
          echo "Linux:"; cat hashes/linux/hash-linux-fixture.txt
          test -s hashes/macos/hash-macos-fixture.txt
          test -s hashes/linux/hash-linux-fixture.txt
          diff hashes/macos/hash-macos-fixture.txt hashes/linux/hash-linux-fixture.txt

      - name: compare golden fixture combat_skirmish
        # The M4a combat golden, verified the same way on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-combat.txt
          echo "Linux:"; cat hashes/linux/hash-linux-combat.txt
          test -s hashes/macos/hash-macos-combat.txt
          test -s hashes/linux/hash-linux-combat.txt
          diff hashes/macos/hash-macos-combat.txt hashes/linux/hash-linux-combat.txt

      - name: compare golden fixture capture_seat
        # The M5a capture golden (attrition, annexation, the Seat flip and
        # the outcome), verified the same way on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-capture-seat.txt
          echo "Linux:"; cat hashes/linux/hash-linux-capture-seat.txt
          test -s hashes/macos/hash-macos-capture-seat.txt
          test -s hashes/linux/hash-linux-capture-seat.txt
          diff hashes/macos/hash-macos-capture-seat.txt hashes/linux/hash-linux-capture-seat.txt

      - name: compare golden fixture stalemate_45min
        # The M5a 45-minute golden (54000 ticks to the territory cap),
        # verified the same way on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-stalemate.txt
          echo "Linux:"; cat hashes/linux/hash-linux-stalemate.txt
          test -s hashes/macos/hash-macos-stalemate.txt
          test -s hashes/linux/hash-linux-stalemate.txt
          diff hashes/macos/hash-macos-stalemate.txt hashes/linux/hash-linux-stalemate.txt

      - name: compare golden fixture m5_first_match
        # The M5b first-match golden (two Standard bots to the Seat
        # capture), verified the same way on each OS.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-m5.txt
          echo "Linux:"; cat hashes/linux/hash-linux-m5.txt
          test -s hashes/macos/hash-macos-m5.txt
          test -s hashes/linux/hash-linux-m5.txt
          diff hashes/macos/hash-macos-m5.txt hashes/linux/hash-linux-m5.txt

      - name: compare M6 acceptance 3 (seed 7, Standard against Standard and Hard against Easy)
        # ROADMAP M6 line 3: both jobs ran `play-bots --seeds 7..7` twice
        # with identical CSVs; their final-hash lines must also agree across
        # the two operating systems.
        run: |
          echo "macOS:"; cat hashes/macos/hash-macos-seed7.txt
          echo "Linux:"; cat hashes/linux/hash-linux-seed7.txt
          test -s hashes/macos/hash-macos-seed7.txt
          test -s hashes/linux/hash-linux-seed7.txt
          diff hashes/macos/hash-macos-seed7.txt hashes/linux/hash-linux-seed7.txt
